<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><style>body{margin:0;color:var(--foreground,#e8e9ef);font:14px/1.6 system-ui}p{margin:0 0 10px}.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{font:inherit;color:inherit;background:var(--secondary,#292b30);padding:6px 12px;border:1px solid var(--border,#494b53);border-radius:8px;cursor:pointer}button[aria-pressed=true]{border-color:var(--accent,#a6d0c2)}img{display:block;width:100%;height:auto}.strip{overflow:hidden;aspect-ratio:700/90;border-radius:10px;background:#202124}.strip img{margin-top:-8.4%}.strip.after img{margin-top:-48.8%}figure{margin:0 0 14px}figcaption{margin:5px 0;color:var(--muted-foreground,#a4a7ae)}.settings{display:grid;grid-template-columns:1fr 1fr;gap:16px}.setting-crop{overflow:hidden;aspect-ratio:380/340;border-radius:10px}.setting-crop img{margin-top:-13%}.setting-crop.compact{aspect-ratio:380/155}.overflow-strip{overflow:hidden;aspect-ratio:700/90;border-radius:10px}.overflow-strip img{margin-top:-4.5%}small{display:block;color:var(--muted-foreground,#a4a7ae)}[hidden]{display:none!important}@media(max-width:480px){.settings{grid-template-columns:1fr}.setting-crop{max-width:300px}}</style><body>
<p><strong>Notch B：分頁延續到鏡頭右邊</strong><br>相同 7 頁、選中第 7 頁、28 tok/s、640px 寬度及 180px 模擬鏡頭。</p>
<div class="modes"><button aria-pressed="true" onclick="show('navigation',this)">分頁列前後</button><button aria-pressed="false" onclick="show('settings',this)">設定前後</button><button aria-pressed="false" onclick="show('overflow',this)">更多分頁</button></div>
<section id="navigation"><figure><figcaption>之前：全部擠在左邊，箭嘴外露、底色被截</figcaption><div class="strip"><img src="evidence/notch-b/comparison.png" alt="原本分頁列"></div></figure><figure><figcaption>現在：完整圓角膠囊，左右延續，7 頁直接可選</figcaption><div class="strip after"><img src="evidence/notch-b/comparison.png" alt="新左右分頁列"></div></figure></section>
<section id="settings" hidden><div class="settings"><figure><figcaption>之前：7 行開關</figcaption><div class="setting-crop"><img src="evidence/pr1164-corrections/notch-settings-app.png" alt="之前的 Notch 設定"></div></figure><figure><figcaption>現在：兩行圖示標籤，點選顯示／隱藏</figcaption><div class="setting-crop compact"><img src="evidence/notch-b/settings-app.png" alt="現在的 Notch 設定"></div></figure></div></section>
<section id="overflow" hidden><figure><figcaption>兩邊都滿時：箭嘴收在膠囊內，逐格瀏覽，保留目前內容</figcaption><div class="overflow-strip"><img src="evidence/notch-b/trail-pager.png" alt="膠囊內嵌箭嘴"></div></figure></section>
<small>分頁列：實際 production renderer＋測試資料與模擬鏡頭。設定：隔離 App 暫存驗收資料。未涵蓋實體 Notch 硬件、IME、Windows/Linux；本輪仍未 push。</small>
<script>function show(id,button){for(const section of document.querySelectorAll('section'))section.hidden=section.id!==id;for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b===button))}</script></body></html>
