<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><style>body{font:14px/1.6 system-ui;color:var(--foreground,#e9e9ee);margin:0}p{margin:0 0 12px}.switches{display:flex;gap:8px;margin:12px 0}button{font:inherit;color:inherit;background:var(--secondary,#292b31);border:1px solid var(--border,#444);border-radius:8px;padding:6px 12px;cursor:pointer}button[aria-pressed=true]{border-color:var(--accent,#9fc9bc)}img{display:block;width:100%;height:auto;border-radius:8px}#settings{max-width:380px}small{display:block;color:var(--muted-foreground,#a2a4ae);margin-top:10px}[hidden]{display:none!important}</style><body><p><strong>Notch 選頁與數字動畫</strong><br>原本設定統一選擇內建／插件頁面；可用頁面與畫面容納量分開，超出時用箭頭或鍵盤切換。</p><div class="switches"><button aria-pressed="true" onclick="show('comparison',this)">前後對比</button><button aria-pressed="false" onclick="show('settings',this)">實際 App 設定</button></div><section id="comparison"><img src="evidence/pr1164-corrections/comparison.png" alt="相同 CPU RAM 數值及 Notch 幾何的前後比較"><small>隔離 Electron production renderer；相同測試資料、4 個內建＋3 個插件頁及 180px 模擬瀏海。修正後 52% 是 Count 動畫途中的截圖，終值同樣是 80%。不是實體瀏海驗收。</small></section><section id="settings" hidden><img src="evidence/pr1164-corrections/notch-settings-app.png" alt="隔離 App 原本 Notch 設定中的統一選頁"><small>實際 feature App，380 CSS px，暫存驗收設定。已測儲存／恢復選擇及無橫向溢出；未涵蓋實體硬件手勢。</small></section><script>function show(id,button){for(const s of document.querySelectorAll('section'))s.hidden=s.id!==id;for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b===button))}</script></body></html>
